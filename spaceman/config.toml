# Spaceman configuration.
version = 1

[shortcuts]
modifier = "ctrl+alt+cmd"

[settings]
single_window_max_width = 1680

[settings.gaps]
inner = 3
top = 3
bottom = 3
left = 3
right = 3

# Rules match in order; the first match wins, so title rules come before app-wide ones.
# Helium profiles share a bundle id; the window title ends with the profile name.
[[rules]]
bundle_id = "net.imput.helium"
title_contains = "Helium - Carl@SynTwin"
action = "route"
workspace = 1

[[rules]]
bundle_id = "net.imput.helium"
action = "route"
workspace = 2

[[rules]]
bundle_id = "com.t3tools.t3code"
action = "route"
workspace = 3

# Alkalye PWA, installed through Chrome
[[rules]]
bundle_id = "com.google.Chrome.app.eihpgemhbeobfbkiheflebibgpkaokpc"
action = "route"
workspace = 4
